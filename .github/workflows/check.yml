name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "::notice::node $(node --version) npm $(npm --version)"
      - run: node tools/check.mjs
      - run: |
          set -o pipefail
          node --test tests 2>&1 | tee test.log || {
            while IFS= read -r line; do echo "::error::$line"; done < test.log
            exit 1
          }
